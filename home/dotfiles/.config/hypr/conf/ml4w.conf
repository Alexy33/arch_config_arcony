# Pavucontrol floating
windowrule {
  name = pavucontrol-float
  match:class = .*org.pulseaudio.pavucontrol.*
  
  float = on
  size = 700 600
  center = on
  pin = on
}

# OpenAI ChatGPT floating
windowrule {
  name = chatgpt-float-1
  match:title = ChatGPT.*
  
  float = on
}

windowrule {
  name = chatgpt-float-2
  match:title = .*chat.openai.com.*
  
  float = on
  size = 500 50%
  move = 20 70
}

# Waypaper
windowrule {
  name = waypaper-float
  match:class = .*waypaper.*
  
  float = on
  size = 900 700
  center = on
  pin = on
}

# SwayNC
layerrule {
  name = swaync-control-center-blur
  match:namespace = swaync-control-center
  
  blur = on
  ignore_alpha = 0.5
}

layerrule {
  name = swaync-notification-blur
  match:namespace = swaync-notification-window
  
  blur = on
  ignore_alpha = 0.5
}

# ML4W Calendar floating
windowrule {
  name = ml4w-calendar-float
  match:class = com.ml4w.calendar
  
  float = on
  move = 100%-w-16 66
  pin = on
  size = 400 400
}

# ML4W Sidebar floating
windowrule {
  name = ml4w-sidebar-float
  match:class = com.ml4w.sidebar
  
  float = on
  move = 100%-w-16 66
  pin = on
  size = 400 740
}

# ML4W Welcome App floating
windowrule {
  name = ml4w-welcome-float
  match:class = com.ml4w.welcome
  
  float = on
  size = 700 600
  center = on
  pin = on
}

# ML4W Settings App floating
windowrule {
  name = ml4w-settings-float
  match:class = com.ml4w.settings
  
  float = on
  size = 800 600
  move = 10% 20%
}

# Blueman Manager
windowrule {
  name = blueman-float
  match:class = blueman-manager
  
  float = on
  size = 800 600
  center = on
}

# nwg-look
windowrule {
  name = nwg-look-float
  match:class = nwg-look
  
  float = on
  size = 700 600
  move = 10% 20%
  pin = on
}

# nwg-displays
windowrule {
  name = nwg-displays-float
  match:class = nwg-displays
  
  float = on
  size = 900 600
  move = 10% 20%
  pin = on
}

# System Mission Center
windowrule {
  name = mission-center-float
  match:class = io.missioncenter.MissionCenter
  
  float = on
  pin = on
  center = on
  size = 900 600
}

# System Mission Center Preference Window
windowrule {
  name = mission-center-prefs
  match:class = missioncenter
  match:title = ^(Preferences)$
  
  float = on
  pin = on
  center = on
}

# Gnome Calculator
windowrule {
  name = calculator-float
  match:class = org.gnome.Calculator
  
  float = on
  size = 700 600
  center = on
}

# Emoji Picker Smile
windowrule {
  name = smile-float
  match:class = it.mijorus.smile
  
  float = on
  pin = on
  move = 100%-w-40 90
}

# Hyprland Share Picker
windowrule {
  name = share-picker-float
  match:class = hyprland-share-picker
  
  float = on
  pin = on
  center = on
  size = 600 400
}

# General floating
windowrule {
  name = dotfiles-floating
  match:class = dotfiles-floating
  
  float = on
  size = 1000 700
  center = on
}

# Floating for Ghostty
windowrule {
  name = ml4w-dotfiles-float
  match:class = ml4w.dotfiles.floating
  
  float = on
  size = 1000 700
  center = on
  pin = on
}

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland