source = ~/.config/hypr/conf/environments/default.conf

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# iGPU UHD Graphics (card1) = GPU primaire de rendu.
# Arc A530M (card0) ajoute car la sortie HDMI est cablee physiquement dessus.
# 1er device = primaire ; l'ordre compte.
env = WLR_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
env = LIBVA_DRIVER_NAME,iHD
env = VDPAU_DRIVER,va_gl
