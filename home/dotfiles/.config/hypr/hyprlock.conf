#  ⚙️ ADEPTUS MECHANICUS HYPRLOCK CONFIG ⚙️
#  "The Omnissiah guides our keystrokes"
#
source = colors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.config/ml4w/cache/blurred_mechanicus_wallpaper.jpg
}

# ═══════════════════════════════════════════════════════════
# MACHINE SPIRIT AUTHENTICATION TERMINAL
# ═══════════════════════════════════════════════════════════
input-field {
    monitor =
    size = 300, 65
    outline_thickness = 3
    dots_size = 0.35
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(139, 0, 0, 0.9)      # Rouge Mechanicus
    inner_color = rgba(25, 25, 25, 0.95)    # Noir tech
    font_color = rgba(255, 100, 100, 1.0)   # Rouge clair
    fade_on_empty = true
    placeholder_text = <i>⚙️ AUTHENTICATE TECHNO-PRIEST...</i>
    rounding = 15
    check_color = rgba(0, 255, 0, 0.8)      # Vert approbation
    fail_color = rgba(255, 0, 0, 1.0)       # Rouge échec
    fail_text = <i>⚠️ MACHINE SPIRIT DISPLEASED ⚠️ ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 15
    shadow_size = 25
    shadow_color = rgba(139, 0, 0, 0.5)
    shadow_boost = 2.0
}

# ═══════════════════════════════════════════════════════════
# CHRONOMETER SANCTUS
# ═══════════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M:%S')"
    color = rgba(255, 100, 100, 1.0)
    font_size = 48
    font_family = JetBrainsMono Nerd Font Bold
    position = -120, 120
    halign = right
    valign = bottom
    shadow_passes = 8
    shadow_size = 15
    shadow_color = rgba(139, 0, 0, 0.7)
}

# DATE IMPERIAL
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B %Y')"
    color = rgba(180, 180, 180, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -120, 85
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# ═══════════════════════════════════════════════════════════
# TECHNO-PRIEST DESIGNATION
# ═══════════════════════════════════════════════════════════
label {
    monitor =
    text = ⚙️ TECHNO-PRIEST: $USER
    color = rgba(255, 100, 100, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = -120, 190
    halign = right
    valign = bottom
    shadow_passes = 8
    shadow_size = 12
    shadow_color = rgba(139, 0, 0, 0.5)
}

# ═══════════════════════════════════════════════════════════
# MACHINE SPIRIT STATUS
# ═══════════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:5000] echo "🔋 POWER CELL: $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 || echo 'EXTERNAL')%"
    color = rgba(100, 255, 100, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 120, 180
    halign = left
    valign = bottom
    shadow_passes = 5
    shadow_size = 8
}

# SYSTEM DIAGNOSTICS
label {
    monitor =
    text = cmd[update:3000] echo "🖥️  COGITATOR LOAD: $(cat /proc/loadavg | cut -d' ' -f1)"
    color = rgba(100, 255, 100, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 120, 150
    halign = left
    valign = bottom
    shadow_passes = 5
    shadow_size = 8
}

# MEMORY BANKS
label {
    monitor =
    text = cmd[update:2000] echo "🧠 MEMORY BANKS: $(free -h | awk '/^Mem:/ {print $3"/"$2}')"
    color = rgba(100, 255, 100, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 120, 120
    halign = left
    valign = bottom
    shadow_passes = 5
    shadow_size = 8
}

# ═══════════════════════════════════════════════════════════
# OMNISSIAH'S BLESSING
# ═══════════════════════════════════════════════════════════
label {
    monitor =
    text = cmd[update:10000] echo "\"$(shuf -n1 ~/.config/hypr/mechanicus_quotes.txt 2>/dev/null || echo 'The Omnissiah protects')\""
    color = rgba(255, 215, 0, 0.9)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Italic
    position = 0, -140
    halign = center
    valign = center
    shadow_passes = 8
    shadow_size = 12
}

# SACRED GEOMETRIES (votre image actuelle)
image {
    monitor =
    path = $HOME/.config/ml4w/cache/square_mechanicus_profile.png
    size = 280
    rounding = 20
    border_size = 4
    border_color = rgba(139, 0, 0, 0.8)
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 15
    shadow_size = 25
    shadow_color = rgba(139, 0, 0, 0.5)
    shadow_boost = 2.0
}

# ═══════════════════════════════════════════════════════════
# RITUAL ACTIVATION MESSAGE
# ═══════════════════════════════════════════════════════════
label {
    monitor =
    text = ⚙️ INITIATING MACHINE SPIRIT COMMUNION ⚙️
    color = rgba(255, 100, 100, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -210
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 15
    shadow_color = rgba(139, 0, 0, 0.6)
}
